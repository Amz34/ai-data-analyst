name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # tests run against in-memory SQLite; the engine still needs a valid DSN at import
      DS_DB_URL: sqlite:///./ci.db
      DS_JWT_SECRET: ci-only-secret
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        run: pytest -q
      - name: Import check (app boots without a database)
        run: python -c "import app.main as m; print('routes:', len(m.app.routes))"
